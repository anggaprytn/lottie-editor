name: Livery Brand Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  livery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Livery check
        uses: anggaprytn/livery/packages/action@v0.1.0-rc.2
        with:
          brand_id: brand_lottie_editor
          api_url: ${{ secrets.LIVERY_API_URL }}
          api_key: ${{ secrets.LIVERY_API_KEY }}
          mode: changed
          fail_on: high
          upload: true
